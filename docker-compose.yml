name: caddy_compose

services:
  caddy_compose:
    image: caddy_compose
    container_name: caddy_compose
    restart: unless-stopped
    pull_policy: never
    network_mode: none
    build:
      context: .
    environment:
      - CADDY_IMAGE=${CADDY_IMAGE}
      - CADDY_DATA=${CADDY_DATA}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_compose_data:/etc/caddy

volumes:
  caddy_compose_data:
    name: caddy_compose_data
